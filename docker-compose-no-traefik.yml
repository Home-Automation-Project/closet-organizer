version: '3.8'

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      GOOGLE_SHEET_INVENTORY_ID: ${GOOGLE_SHEET_INVENTORY_ID:-}
      GOOGLE_SHEET_REMINDERS_ID: ${GOOGLE_SHEET_REMINDERS_ID:-}
      APP_HOST: ${APP_HOST:-http://localhost}
    ports:
      - "8000:8000"
    volumes:
      - ./data/json:/app/data/json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - api

